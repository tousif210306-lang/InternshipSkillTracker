# Supply these values from the hosting platform using TiDB Cloud connection details.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate mappings at startup without creating, altering, or dropping tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Configure with the deployed frontend origin, including scheme and host.
app.cors.allowed-origins=${FRONTEND_URL}

# JwtUtils rejects an unset or too-short JWT_SECRET during startup.
jwt.secret=${JWT_SECRET}

# PORT is provided by the hosting platform; retain 8081 as the local default.
server.port=${PORT:8081}
