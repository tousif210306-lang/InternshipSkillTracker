# Supply these values from the hosting platform using database connection details.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-create or update schema at startup so missing tables are created automatically.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Configure with the deployed frontend origin, including scheme and host.
app.cors.allowed-origins=${FRONTEND_URL}

# JwtUtils rejects an unset or too-short JWT_SECRET during startup.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.password=${SKILLTRACKER_ADMIN_PASSWORD:}

# PORT is provided by the hosting platform; retain 8081 as the local default.
server.port=${PORT:8081}
