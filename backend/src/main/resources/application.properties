spring.application.name=internship-skill-tracker
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:mem:internship_skill_tracker;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Local frontend origins; production overrides this with FRONTEND_URL.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5174,http://127.0.0.1:5174}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.password=${SKILLTRACKER_ADMIN_PASSWORD:}
